<!DOCTYPE html>

<html lang="ja">

<head>
<meta charset="UTF-8">
<title>属性値の変更</title>
<style>
  body {
    width: 704px;
    margin: 0px auto;
    text-align: center;
  }
  h1{
    text-align: center;
    font-size: 50px;
    font-family: 'Times New Roman', Times, serif;
    
  }
  #photo_frame {
    padding: 20px;
  }
  #big_img {
    border: solid 10px #FFFFFF;
    box-shadow: 7px 7px 10px #d4d4d4;
  }
  #photo_list {
    display: flex;
    flex-wrap: wrap;
    padding: 5px;
    border: solid 1px #e3e3e3;
  }
  #photo_list img {
    margin: 10px;
    transition: margin 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), 
                box-shadow 0.3s ease, 
                border-color 0.3s ease;
  }
</style>
</head>

<body>
<h1>PHOTO ALBUM</h1>
<div id="photo_frame">
  <img id="big_img" src="big_pic01.jpg">
</div>
<div id="photo_list">
  <img src="pic01.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
  <img src="pic02.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
  <img src="pic03.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
  <img src="pic04.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
  <img src="pic05.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
  <img src="pic06.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
  <img src="pic07.jpg" onclick="mClick(this)"
       onmouseover="mOver(this)" onmouseout="mOut(this)">
</div>

<script>
function mClick(obj) {
  let fileName = obj.getAttribute('src');
  fileName = 'big_' + fileName;
  document.getElementById('big_img').setAttribute('src', fileName);
}
function mOver(obj) {
  obj.style.marginTop = '5px';
  obj.style.marginBottom = '15px';
  obj.style.boxShadow= '0px 5px 15px #666666'
}
function mOut(obj) {
  obj.style.margin = '10px';
  obj.style.boxShadow= 'none'
}
</script>
</body>

</html>
